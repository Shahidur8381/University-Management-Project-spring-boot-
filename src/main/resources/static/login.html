<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - University Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #fff;
            padding: 40px 36px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 400px;
        }
        .login-card h1 {
            font-size: 22px;
            color: #222;
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
            background: #fafafa;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4a7cff;
            background: #fff;
        }
        .btn-login {
            width: 100%;
            padding: 11px;
            background: #4a7cff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-login:hover { background: #3a65d4; }
        .msg {
            padding: 10px 12px;
            border-radius: 5px;
            margin-bottom: 18px;
            font-size: 13px;
        }
        .msg-error { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; }
        .msg-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .defaults {
            margin-top: 28px;
            padding: 14px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
        }
        .defaults h4 {
            font-size: 13px;
            color: #333;
            margin-bottom: 8px;
        }
        .defaults code {
            background: #e9ecef;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 12px;
            color: #333;
        }
        .defaults .row { margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>University Management System</h1>
        <p class="subtitle">Sign in to your account</p>

        <div id="error-msg" class="msg msg-error" style="display:none">Invalid username or password.</div>
        <div id="logout-msg" class="msg msg-success" style="display:none">You have been logged out successfully.</div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="defaults">
            <h4>Default Accounts</h4>
            <div class="row"><strong>Admin:</strong> <code>admin</code> / <code>admin123</code></div>
            <div class="row"><strong>Teacher:</strong> <code>teacher</code> / <code>teacher123</code></div>
            <div class="row"><strong>Student:</strong> <code>student</code> / <code>student123</code></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) document.getElementById('error-msg').style.display = 'block';
        if (params.has('logout')) document.getElementById('logout-msg').style.display = 'block';
    </script>
</body>
</html>
